<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to quantum.fit.vut.cz</title>
<link rel="canonical" href="https://quantum.fit.vut.cz/">
<meta name="robots" content="noindex">
<!-- Fallback for clients without JS: lands on the site root, path is lost. -->
<meta http-equiv="refresh" content="0; url=https://quantum.fit.vut.cz/">
<!-- GitHub Pages serves this file for every unmatched path, so it carries the
     path/query/fragment over to the new domain. The target origin is fixed,
     only the path is taken from the request. -->
<script>location.replace("https://quantum.fit.vut.cz" + location.pathname + location.search + location.hash);</script>
</head>
<body>
<p>This site has moved to <a href="https://quantum.fit.vut.cz/">quantum.fit.vut.cz</a>.</p>
</body>
</html>
